<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Accesos - Portería GDN</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f8f9fa; }
    iframe { width: 100%; height: 100vh; border: none; display: block; }
  </style>
</head>
<body>
  <!-- Reemplaza esta URL con tu enlace real terminado en /exec -->
  <iframe src="https://script.google.com/macros/s/AKfycbyQsYzWSaxfzS4li-5oR7eFIcqghVQlQmXUuDzYlDp6qiEW5_l_Kt8Qt_Iy4H-45C1HAg/exec"
          allow="camera *; microphone *; display-capture *"
          sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>
</body>
</html>
