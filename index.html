<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Accesos - Portería GDN</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #f8f9fa; 
    }
    iframe { 
      width: 100%; 
      height: 100vh; 
      border: none; 
      display: block; 
    }
  </style>
</head>
<body>
  <!-- Asegúrate de cambiar la URL por tu enlace /exec real de Apps Script -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyQsYzWSaxfzS4li-5oR7eFIcqghVQlQmXUuDzYlDp6qiEW5_l_Kt8Qt_Iy4H-45C1HAg/exec"
    allow="camera *; microphone *; autoplay; clipboard-write; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>
</body>
</html>
