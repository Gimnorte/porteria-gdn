<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Accesos - Portería GDN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .btn-acceso {
      background-color: #0d6efd;
      color: white;
      padding: 18px 30px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      text-decoration: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>Control de Accesos GDN</h2>
  <p>Redireccionando al sistema de portería...</p>

  <!-- Botón por si el celular no redirecciona automáticamente -->
  <a id="linkApp" href="#" class="btn-acceso">Abrir Portería</a>

  <script>
    // PEGA AQUÍ TU ENLACE REAL DE APPS SCRIPT TERMINADO EN /exec
    const urlAppsScript = "https://script.google.com/macros/s/AKfycbyQsYzWSaxfzS4li-5oR7eFIcqghVQlQmXUuDzYlDp6qiEW5_l_Kt8Qt_Iy4H-45C1HAg/exec";

    document.getElementById("linkApp").href = urlAppsScript;

    // Redirección automática
    window.location.href = urlAppsScript;
  </script>

</body>
</html>
